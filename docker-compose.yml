services:
  mysql:
    image: mysql:8.4
    container_name: hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hospital_db
      MYSQL_USER: hospital
      MYSQL_PASSWORD: hospital_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Europe/Moscow
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
